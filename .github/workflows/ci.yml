name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Markdown and images are not test inputs; docs/examples/*.json are.
    paths-ignore: ['**/*.md', 'docs/images/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/images/**']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its unfinished run; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests run no checks; marking one ready for review runs them.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
