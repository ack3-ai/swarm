<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1085" viewBox="0 0 880 1085" role="img" aria-labelledby="title desc">
<title id="title">From observation to report</title><desc id="desc">Read from top to bottom. Agents propose decisions and independent reviewers check each one. Code retains all earlier candidates and open questions, as well as disagreements, for verification. Observations refuted throughout remain recorded. Verification records reproduced behavior and exploitability separately; its result can remain unresolved. All evidence reaches the reporter. Separately, code rejects invalid task outputs for bounded repair; exhausted required work fails the audit rather than producing a completed report.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#203141}.title{font-size:25px;font-weight:650}.body{font-size:20px;fill:#506273}.tag{font-size:14px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#8a9caa;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8a9caa" stroke-width="1.6"/></marker></defs>
<rect width="880" height="1085" rx="20" fill="#f8fafc"/>
<rect x="45" y="28" width="790" height="104" rx="12" fill="#f2efff" stroke="#cbbfec"/>
<text x="67" y="56" class="tag" style="fill:#6546a3">LLM + TOOLS</text>
<text x="67" y="88" class="title">Observation → proposed decision</text>
<text x="67" y="117" class="body">Candidate, refuted or unresolved.</text>
<rect x="45" y="168" width="790" height="104" rx="12" fill="#f2efff" stroke="#cbbfec"/>
<text x="67" y="196" class="tag" style="fill:#6546a3">LLM + TOOLS</text>
<text x="67" y="228" class="title">Negative review (if selected)</text>
<text x="67" y="257" class="body">Check each decision, including dismissals.</text>
<path d="M440 132V158" class="line"/>
<rect x="45" y="308" width="790" height="77" rx="12" fill="#e9f7f3" stroke="#a8d8ca"/>
<text x="67" y="337" class="tag" style="fill:#176b59">CODE</text>
<text x="67" y="366" class="title">Keep earlier candidates and review disagreements.</text>
<path d="M440 272V298" class="line"/>
<path d="M440 385V411H295V449" class="line"/>
<path d="M440 411H702V449" class="line"/>
<rect x="175" y="420" width="240" height="25" fill="#f8fafc"/><rect x="589" y="420" width="225" height="25" fill="#f8fafc"/>
<text x="195" y="439" class="body">Ever kept or disputed</text>
<text x="605" y="439" class="body">Refuted throughout</text>
<rect x="45" y="459" width="500" height="194" rx="12" fill="#f2efff" stroke="#cbbfec"/>
<text x="67" y="487" class="tag" style="fill:#6546a3">LLM + TOOLS</text>
<text x="67" y="519" class="title">Verification</text>
<text x="67" y="548" class="body">Did the behavior reproduce?</text>
<text x="67" y="575" class="body">Is exploitation supported?</text>
<text x="67" y="602" class="body">Record both for each observation.</text>
<rect x="570" y="459" width="265" height="194" rx="12" fill="#ffffff" stroke="#dce3e9"/>
<text x="592" y="487" class="tag" style="fill:#536577">RECORD</text>
<text x="592" y="519" class="title">Keep in record</text>
<text x="592" y="548" class="body">No candidate</text>
<text x="592" y="575" class="body">or disagreement</text>
<text x="592" y="602" class="body">to verify.</text>
<path d="M295 653V694H440V723" class="line"/>
<path d="M702 653V694H440" fill="none" stroke="#8a9caa" stroke-width="2"/>
<rect x="45" y="733" width="790" height="104" rx="12" fill="#f2efff" stroke="#cbbfec"/>
<text x="67" y="761" class="tag" style="fill:#6546a3">LLM + TOOLS</text>
<text x="67" y="793" class="title">Reporting</text>
<text x="67" y="822" class="body">Findings, refutations and unresolved questions.</text>
<text x="45" y="891" class="title">If a required task returns invalid output</text>
<rect x="45" y="913" width="240" height="91" rx="12" fill="#e9f7f3" stroke="#a8d8ca"/>
<text x="65" y="944" class="tag" style="fill:#176b59">CODE</text>
<text x="65" y="978" class="title">Reject output</text>
<rect x="325" y="913" width="230" height="91" rx="12" fill="#f2efff" stroke="#cbbfec"/>
<text x="345" y="944" class="tag" style="fill:#6546a3">LLM + TOOLS</text>
<text x="345" y="978" class="title">Output correction</text>
<rect x="595" y="913" width="240" height="91" rx="12" fill="#fff2ee" stroke="#efc4b7"/>
<text x="615" y="944" class="tag" style="fill:#a44228">IF EXHAUSTED</text>
<text x="615" y="978" class="title">Audit fails</text>
<path d="M285 958H315" class="line"/>
<path d="M555 958H585" class="line"/>
<text x="45" y="1044" class="body">Valid repaired output continues the stage.</text>
