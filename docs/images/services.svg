<svg xmlns="http://www.w3.org/2000/svg" width="960" height="604" viewBox="0 0 960 604" role="img" aria-labelledby="title desc">
<title id="title">Swarm services</title><desc id="desc">The front door routes run controls to private runtimes. The release coordinator serializes activation and starts. Runtime code schedules LLM agents in containers and validates outputs. D1 stores routes and indexes; R2 stores source and evidence.</desc>
